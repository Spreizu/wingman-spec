name: Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: vscode-extension/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node esbuild.mjs --production
      - name: Package
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          pnpm exec vsce package --no-dependencies --out "wingman-spec-$version.vsix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: wingman-spec-${{ steps.pkg.outputs.version }}
          path: vscode-extension/wingman-spec-${{ steps.pkg.outputs.version }}.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wingman-spec-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wingman-spec-*.vsix --repo "$GITHUB_REPOSITORY" --title "Wingman Spec ${GITHUB_REF_NAME#v}" --generate-notes
