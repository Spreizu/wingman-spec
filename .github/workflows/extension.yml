name: Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: vscode-extension/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node esbuild.mjs --production
      - name: Package
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          pnpm exec vsce package --no-dependencies --out "wingman-spec-$version.vsix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: wingman-spec-${{ steps.pkg.outputs.version }}
          path: vscode-extension/wingman-spec-${{ steps.pkg.outputs.version }}.vsix
          if-no-files-found: error


  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      VSIX: wingman-spec-${{ needs.build.outputs.version }}.vsix
    steps:
      - name: Tag matches package.json version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: wingman-spec-${{ needs.build.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # VS Code Marketplace, one of two keyless modes (no PAT is stored):
      # 1. Trusted Publishing: repository variable VSCE_TRUSTED_PUBLISHING=true.
      # 2. Microsoft Entra ID: repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID
      #    (and AZURE_SUBSCRIPTION_ID for a managed identity).
      - name: Marketplace sign-in mode
        id: vsce
        env:
          TRUSTED: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ]; then
            echo "mode=entra" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither VSCE_TRUSTED_PUBLISHING nor AZURE_CLIENT_ID and AZURE_TENANT_ID is set: skipped the VS Code Marketplace"
          fi
      - name: Azure login (Entra ID)
        if: steps.vsce.outputs.mode == 'entra'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ vars.AZURE_SUBSCRIPTION_ID == '' }}
      - name: Marketplace profile ID of the Entra identity
        if: steps.vsce.outputs.mode == 'entra'
        continue-on-error: true
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
      - name: Publish to the VS Code Marketplace (Trusted Publishing)
        if: steps.vsce.outputs.mode == 'oidc'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "$VSIX"
      - name: Publish to the VS Code Marketplace (Entra ID)
        if: steps.vsce.outputs.mode == 'entra'
        run: npx --yes @vscode/vsce@4.1.0 publish --azure-credential --packagePath "$VSIX"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set: skipped Open VSX"
            exit 0
          fi
          npx --yes ovsx@1.3.0 publish "$VSIX" -p "$OVSX_PAT"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wingman-spec-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" wingman-spec-*.vsix --repo "$GITHUB_REPOSITORY" --title "Wingman Spec ${GITHUB_REF_NAME#v}" --generate-notes
