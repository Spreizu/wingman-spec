name: Release

# A v* tag: one vsix per platform with the CLI bundled, attached to the GitHub release,
# then published to the VS Code Marketplace and Open VSX.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: vscode-extension/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vscode-extension/pnpm-lock.yaml
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: pnpm install --frozen-lockfile
        working-directory: vscode-extension
      - id: version
        name: Tag matches package.json version
        run: |
          version=$(node -p "require('./vscode-extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm run typecheck && pnpm test
        working-directory: vscode-extension
      - name: Package the vsix files (6 platforms)
        env:
          VSCE: pnpm --dir vscode-extension exec vsce
        run: scripts/package-vsix.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-extension/dist/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: Create the release with the vsix files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" vsix/*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" vsix/*.vsix --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Wingman Spec $VERSION" --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # VS Code Marketplace, one of two keyless modes (no PAT is stored):
      # 1. Trusted Publishing: repository variable VSCE_TRUSTED_PUBLISHING=true.
      # 2. Microsoft Entra ID: repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID
      #    (and AZURE_SUBSCRIPTION_ID for a managed identity).
      - name: Marketplace sign-in mode
        id: vsce
        env:
          TRUSTED: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ]; then
            echo "mode=entra" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither VSCE_TRUSTED_PUBLISHING nor AZURE_CLIENT_ID and AZURE_TENANT_ID is set: skipped the VS Code Marketplace"
          fi
      - name: Azure login (Entra ID)
        if: steps.vsce.outputs.mode == 'entra'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ vars.AZURE_SUBSCRIPTION_ID == '' }}
      # The platform vsix files are published together; VS Code installs the one for its platform.
      - name: Publish to the VS Code Marketplace (Trusted Publishing)
        if: steps.vsce.outputs.mode == 'oidc'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath vsix/*.vsix
      - name: Publish to the VS Code Marketplace (Entra ID)
        if: steps.vsce.outputs.mode == 'entra'
        run: npx --yes @vscode/vsce@4.1.0 publish --azure-credential --packagePath vsix/*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set: skipped Open VSX"
            exit 0
          fi
          for f in vsix/*.vsix; do npx --yes ovsx@1.3.0 publish "$f" -p "$OVSX_PAT"; done
