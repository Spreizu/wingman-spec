name: wingman-spec
version: 1
description: Senior-analyst planning (app-map → proposal → specs → design → ADRs → tasks) with a TDD implementation phase (one subagent per task, script-verified) for junior developers
artifacts:
  - id: app-map
    generates: app-map.md
    description: Map of the whole app (or the slice of it this change belongs to)
    template: app-map.md
    instruction: |
      You are a senior analyst. Produce the map that places THIS change inside the WHOLE app,
      so that later changes stay consistent with each other.

      If the user has not yet resolved the open decisions, stop and run the `grilling`
      skill with them first. Do not guess answers to product or architecture questions.

      Sections (follow the template):
      - **Product goal and users**: one paragraph plus personas/roles.
      - **Capability inventory**: every capability the full app will need, kebab-case names
        (these become `specs/<name>.md`). One line each, with priority (P0/P1/P2).
      - **Dependencies**: which capability needs which. Keep it acyclic.
      - **Bounded contexts / modules**: where the seams are.
      - **Build order**: thin vertical slices, each independently shippable and testable.
        Slice 1 should be a walking skeleton.
      - **This change**: exactly which slice and capabilities this change covers, and which
        are deferred. A change should be small enough for junior developers to finish with
        a reviewable diff; if the slice is bigger, shrink it and defer the rest.
      - **Cross-cutting concerns**: auth, error handling, logging, config, i18n, etc.
      - **Open questions**: only genuinely deferrable ones.
      - **Design map** (only when the input includes a design to match: image, prototype, export):
        point to the change's `design-map.md` and summarise its gaps here. Explore or
        /spec-propose builds the map before this artifact. It maps every design element to a
        project token, project component, framework default or flagged arbitrary value, with
        its source, and lists the gaps and the questions for the designer.

      For a small follow-up change on an existing app, keep this short: reference the existing
      capabilities in the living `specs/` and describe only where the new work fits.

      **Fast path (Size S, Risk none, no sensitive path, no UI): no app map.** **Size S otherwise:**
      `wingman-spec app-map <change> --apply` writes the two lines
      (`This change: ...`, `Fits: ...`) from the proposal and specs. If the change later turns out
      bigger (`wingman-spec size` fails), write the full map.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Why this change is needed and which capabilities it creates or modifies
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this change is needed.

      **Two special changes (new products only, see `/spec-green-start`).** `Kind: spec-only` on its own
      line: the change only writes specs and ADRs (the whole-product foundation, one capability or
      integration). It has no code tasks: `tasks.md` is one ticked line, and the size and task checks
      do not apply. `Slice: <id>`: the change builds one slice of `roadmap/` from specs that
      already exist; it has no `specs/` folder, the line `Specs: none`, and tasks that each cite
      `Spec: <capability>/<requirement-slug>`. A change is never both.

      **Size and risk first.** Line 1 is `Size: S`, `M` or `L`. Line 2 is `Risk: none`, or the
      kinds that apply: security, money, data-migration, concurrency, public-api. Decide the size
      here, once, from what the specs will contain. This table is the only definition of the sizes:

      | Size | Capabilities | Requirements | Other limits | Implementation tasks |
      |---|---|---|---|---|
      | S | 1 | at most 3 requirements | nothing BREAKING, `Risk: none`, no ADR, no visual scenario | at most 3 |
      | M | up to 2 capabilities | more than 3 allowed | UI with visual scenarios, or an ADR | at most 5 |
      | L | 3 or more | any | anything BREAKING, or any risk | at most 8 |

      A change is S only when everything in the S row holds, L when anything in the L row applies,
      and M otherwise. Task caps S/M/L: 3/5/8. Size trims documents only. It never removes a scenario, an edge case
      or a test. Never delete a visual block to stay S: raise the size.

      `wingman-spec lint` reports the planning path:
      - **fast**: Size S, `Risk: none`, no UI, and no sensitive path in any `Files:` line (auth,
        session, payment, migration, schema, secrets, tokens, a dependency manifest). Write only
        proposal, specs and tasks.
      - **full**: every other change. Size S writes a two-line app map (`wingman-spec app-map`),
        a design with Implementation guide and Pitfalls, and `adrs/none.md`. M and L write every
        section.
      If a fast change's edits leave its scope (a sensitive path, UI files, a dependency manifest,
      more than 150 changed lines), `check` upgrades it. Write the full artifacts before `next`
      continues.

      `wingman-spec size <change>` checks the declared size against the
      specs. If the specs outgrew it, the command fails: raise the Size line and write the full
      artifacts. A bigger size than needed is allowed but costs planning time.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity.
      - **What Changes**: bullets; mark breaking changes with **BREAKING**.
      - **Capabilities**:
        - **New Capabilities**: kebab-case names from the app-map's "This change" section.
          Each becomes `specs/<name>.md`.
        - **Modified Capabilities**: existing capabilities (see the living `specs/`) whose
          REQUIREMENTS change. Leave empty if none.
      - **ADR candidates**: architecturally significant decisions this change will force
        (framework, data store, auth approach, API style, sync vs async, ...). One line each.
        They become files in `adrs/` later. List "none" if there are truly none.
      - **Impact**: affected code, APIs, dependencies, systems.
      - **Edge cases**: one bullet per edge case the request or the user's answers name: long
        text, empty, error, many items, limits, invalid input, missing data. Use their words. End
        each bullet with `-> <capability>/<scenario-slug>`, the scenario that proves it.
        A UI edge case points at a visual scenario whose `state:` shows that content, for example
        an item with a long name at 375 px. Write `- none named` only when there are none.
        `wingman-spec lint` fails a bullet with no scenario or an unknown one, and a UI case
        with no such state. It warns when the plan mentions an edge case the list lacks. Every
        size keeps every edge case.

      - **UX checklist** (UI changes only): a `## UX checklist` section with one line for each of
        loading, empty, error, disabled, validation, recovery, keyboard, narrow and long-text.
        Write `- <item>: scenario <capability>/<slug>` for a scenario in the specs, or
        `- <item>: Not applicable: <reason specific to this screen>`. `wingman-spec lint` warns about a
        missing or unanswered item.

      Every change must declare at least one capability, or add the line `Specs: none` next to
      `Size:` and `Risk:` (pure refactor/tooling/docs). Do not invent requirements.

      Keep it to 1-2 pages: why and what. The how belongs in design.md. Write it by the
      `spec-writing` skill.
    requires: []

  - id: specs
    generates: "specs/*.md"
    description: Behavior specifications precise enough for junior developers to implement and test
    template: spec.md
    instruction: |
      Create one spec file per capability listed in the proposal. A spec is a behavior
      contract: WHAT the system does, never HOW.

      The audience is a junior developer who will turn each scenario into a failing test
      before writing code (TDD). So every scenario must be:
      - Concrete: name real inputs and exact expected outputs / states / error messages / codes.
      - Testable: one WHEN/THEN pair that can be asserted automatically.
      - Complete: for each requirement cover the happy path, at least one error or
        boundary case, and permissions/validation where relevant.

      Good: "WHEN a user submits an empty title THEN the system rejects it with error
      `TITLE_REQUIRED` and creates no record".
      Bad: "WHEN input is invalid THEN the system handles it gracefully".
      Write every requirement and scenario by the `spec-writing` skill: one statement per
      sentence, a value in every THEN, no vague words.

      Avoid in specs: class/function names, library/framework choices, step-by-step
      implementation. Those belong in design.md and tasks.md.

      New capabilities: `specs/<capability>.md` with the exact kebab-case name from the
      proposal. Modified capabilities: use the existing file name from the living `specs/`.

      Size S does not remove scenarios. Write the scenario that each bullet under the proposal's
      **Edge cases** names. For a UI case, write a visual scenario with a matching `state:`.

      **Why line** (when `traceability` is not `off`). On the line under each SHALL sentence, write
      `Why: <role> wants <outcome>, so that <reason>.` in the words of the person who asked, for
      example `Why: The account owner wants to reset a forgotten password, so that they
      are not locked out.` Name a role or a person, not "the user" or "the system". A technical
      requirement names the operator or maintainer who needs it.
      - The proposal's `## Why` explains the change. The requirement's Why explains the
        requirement and stays with it.
      - `wingman-spec lint` flags a requirement without a Why (`missing-why`) or with fewer
        than 5 words (`why-too-short`).
      - A MODIFIED block repeats its Why line.
      - To rewrite the Why of an existing requirement, or to remove a requirement: STOP and show
        the owner the old and the new text. After they agree, add `Owner approval: <name>, <date>`
        to proposal.md. Until then lint fails and `finish` lists `why_owner_approval`.
      - Changing the SHALL text or the scenarios under the same Why needs no approval.
      - A want in the request that no requirement covers is a missing requirement: add it.

      Delta operations (use ## headers):
      - `## ADDED`: new behavior
      - `## MODIFIED`: MUST include the full updated requirement block (the name is the key)
      - `## REMOVED`: the `### Requirement:` heading with **Reason** and **Migration**
      - `## RENAMED`: one line per rename, `- Old name -> New name`
      `wingman-spec sync` merges them in the order RENAMED, REMOVED, MODIFIED, ADDED and stops on any conflict.

      Format rules:
      - `### Requirement: <name>` followed by a SHALL/MUST statement.
      - `#### Scenario: <name>` with exactly 4 hashtags, using WHEN/THEN bullets.
        Other heading depths fail silently.
      - Every requirement has at least one scenario.
      - New capabilities start with `## Purpose`: one or two sentences, 50+ characters. Sync
        copies it into the living spec, where `wingman-spec validate` fails a shorter one.
        `wingman-spec lint` checks it before apply.
        Never add `## Purpose` to a delta for an existing capability.

      Common pitfall: MODIFIED with partial content loses detail at sync time. If you are
      only adding behavior, use ADDED.

      **Invariant scenarios.** Every requirement that computes, transforms, filters, sorts or
      stores data gets one more scenario, named `Invariant: <what always holds>`, for the
      property that must hold for every input. Pick the ones that apply:
      - the input is not modified, and the result shares no mutable object (list, item, nested
        record) with the input, so changing one never changes the other;
      - the same input always gives the same result (determinism; applying twice equals applying
        once where that is expected);
      - order is preserved, or defined (stable sort, tie-break);
      - rounding happens once, at a stated precision and rule.
      Make it as concrete as any scenario, e.g. "WHEN the summary is built from a list of 3
      entries and an entry of the result is then edited THEN the input still holds the original
      3 entries, unchanged and in order". Skip it only for requirements that just display data.
      Tasks tag a test for it like any other scenario. `wingman-spec lint` warns when a
      requirement that changes data has no Invariant scenario. It reads plain words only and
      ignores code spans, identifiers and quoted UI text. Requirements that only show or label
      data are exempt.

      **Visual scenarios (UI changes).** Every screen, component or state a user sees that this
      change adds or alters gets a scenario with a fenced `visual` block under its WHEN/THEN lines.
      The verifier opens it in a real browser at each viewport. It reads DOM geometry, computed
      styles and the ARIA snapshot of the key elements; it takes no screenshots. It fails on:
      - console errors, failed requests and accessibility violations;
      - sideways scrolling;
      - key elements that are missing, hidden, off-screen or overlapping.
      A declared scenario also guards later tasks: its ARIA structure may change only when the
      task's `Files:` names its component. A reviewer compares before/after clips of the task's
      own key elements with the THEN text and the design reference. Fields (one per line):
      - `route: /path` (required): the page to open.
      - `key: <CSS selector>` (one or more; required): elements that must be visible, inside the
        viewport and not overlap each other. Prefer `[data-testid="..."]` and name the test ids
        in the THEN text, so the implementer adds them.
      - `viewports: 375, 768, 1280` (optional; this is the default).
      - `state: <kebab-name>` (optional, repeatable), followed by indented `do: <step>` lines that
        reach it, indented `key:` lines that exist only there and indented `expect:` lines that hold
        only there. Steps: `click <sel>`,
        `fill <sel> = <text>`, `press <Key>`, `hover <sel>`, `wait <ms>`, `goto /path`,
        `storage <localStorage key> = <value>` (then reload), `reload`. Without states the page
        is checked as loaded. Cover the empty, error and boundary states the requirement names.
      - `overlay: <selector>` (optional): a modal/drawer that may cover other key elements.
      - `role: <name>` (optional): the user the page is opened as, defined under `visual.roles` in
        `wingman-spec.yaml` (or `anonymous`, the default). Use it for gated features; one role
        per block, so write one scenario per role. Never put a password in a spec.
      - **States that need data** the live app lacks (a blocked account, a long name, an empty
        list): keep the scenario and its block. Reach the state with a test account role in
        `visual.roles` such as `role: blocked-customer`, seed data in the start command
        (`visual.command`), or a route or `storage` value. The design names which, and a task sets it
        up. Only when none works, replace the block with `Not visual: <reason>; covered by <test>`
        under the scenario.
        `absent: <selector>` (repeatable, also inside a state): must NOT be visible to that role.
        `redirects-to: /path`: the route must end on that path (e.g. `/login` for a visitor).
      - `ignore: <code>` / `ignore-http: <text>` (optional, repeatable, whole block): skip a defect
        outside this change, for example a third-party widget or page chrome you do not own.
        - Allowed codes: `a11y:`, `runtime:` (console-error, page-error, request-failed, http-error),
          `content:broken-image` and `layout:horizontal-overflow`. A code ending in `:` is a
          prefix: `ignore: a11y:` skips every axe rule, `a11y:color-contrast` skips one.
        - `ignore-http: /ads/` skips failed requests, HTTP errors, console errors and broken images
          whose message contains the text.
        - Never skip a defect of the element you build. A missing key, `expect:`, `absent:` or
          role failure cannot be skipped.
        The report counts and lists skips ("ignored (n)"). `visual.ignore` / `visual.ignore_http`
        in `wingman-spec.yaml` skip the same for every scenario.
      - `component: <Name>` (optional): the component (file basename) it shows; a later task whose
        `Files:` names it may change this scenario's structure without failing the guard.
      - `reference: <path>` (optional, repeatable): a design image, relative to the change
        directory or the specs root; per viewport with `@375`, `@1280`, `@<768`, `@>=768`, and an
        optional crop `design/page-1280.png#x,y,w,h`. A scenario with a reference must have a
        `design-map.md` row (Selector column) for each of its key and expect selectors.
      - `expect: <selector> <css-property> ~|=|!= <value | token:name> [@viewports]` (optional,
        repeatable, also indented under a state): a checkable fact from the design map, measured
        from computed styles, e.g. `expect: [data-testid="plan-amount"] font-size ~ token:text-display`,
        `expect: [data-testid="plan-list"] gap ~ token:spacing-gutter`, `expect: [data-testid="save"]
        background-color ~ token:color-primary`. `~` allows a small difference (colours ΔE ≤ 6,
        lengths 8%), `=` is near-exact, `!=` must differ. Prefer `token:<name>` (a CSS custom
        property, `--name`) over raw values. Relations:
        `expect: <a> left-with|right-with|top-with|center-with|before|above|below|left-of|right-of|same-row|stacked|same-width|same-height|inside <b> [~ <px>] [@viewports]`
        and `expect: <a> gap-to <b> ~ <px | token:name>`. `before` is reading order.
      **Where keys and expects apply.**
      - A block-level `key:` must hold in every state.
      - A block-level `expect:` describes the page as the route opens, before any `do:` step.
        States do not inherit it. Exception: an expect whose elements are not on the loaded page,
        such as a drawer that opens on click, is checked in each state that shows them.
      - A fact for one state goes indented under that state (`  expect: ...`) and is checked
        there only.
      A state that filters, empties or replaces content lists facts only about the elements it
      still shows. Under `state: no-match`, write
      `  expect: [data-testid="result-count"] above [data-testid="empty-state"]`, not a block-level
      `... above [data-testid="result-card"]`. Avoid positional selectors (`li:nth-child(2)`) in a
      state that filters the list. `wingman-spec lint` lists (info) block-level expects whose
      elements a state probably removes.
      Scenario names must be unique within a capability (the id is `<capability>/<scenario-slug>`).
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design and implementation guide for junior developers
    template: design.md
    instruction: |
      Create the design that explains HOW to build what the specs require.
      Write for a junior developer who has not seen this codebase's history.

      Not written on the fast path (see the proposal instruction). **Size S** (proposal.md): write only **Implementation guide** and **Pitfalls**, plus a short
      **Testing approach** if it adds something; delete the other template sections. Size M and L
      write every section below (`wingman-spec size` fails an M/L design without Decisions).

      The specs are input here. Do not delete or weaken a scenario or a ```visual block. A visual
      state the live app cannot show gets a way to reach it in **Testing approach** (see "States
      that need data" under specs). If a scenario cannot stay, stop and ask the owner.

      Sections (follow the template):
      - **Context**: current state and constraints only. Reference the proposal for motivation.
      - **Goals / Non-Goals**
      - **Decisions**: each with rationale and alternatives considered. Mark the significant
        ones with the ADR slug they will get (e.g. "see ADR: `use-postgres`"); the `adrs`
        artifact writes those out next.
      - **Implementation guide**: module/file outline, key interfaces and signatures, data
        model, request/response shapes, and the order in which pieces fit together.
      - **Pitfalls**: the mistakes a junior is most likely to make here, and how to avoid them.
      - **Testing approach**: test levels (unit/integration/e2e), fixtures, and what to mock.
      - **Glossary**: domain terms used in the specs.
      - **Risks / Trade-offs**: `[Risk] → Mitigation`.
      - **Migration Plan**: if applicable.
      - **Open Questions**: only deferrable unknowns. If a question would change the specs,
        the approach, or the task breakdown, resolve it now with the user (use `grilling`).

      Do not restate the proposal or specs; point to them.
    requires:
      - specs

  - id: adrs
    generates: "adrs/*.md"
    description: Architecture Decision Records, promoted to the repository root during sync
    template: adr.md
    instruction: |
      Create one ADR file per architecturally significant decision made in design.md
      (and listed under "ADR candidates" in the proposal).

      File: `adrs/<slug>.md`, where `<slug>` is kebab-case and stable (it is the identity of
      the ADR across re-syncs; never rename it after the first sync).

      Follow the template. Keep each ADR to about one page:
      - Context: the forces at play.
      - Decision: what we chose, in one or two sentences, active voice ("We will use ...").
      - Alternatives considered, with why each was rejected.
      - Consequences: good, bad, and follow-up work.

      Front matter keys:
      - `title`, `status` (leave as `Proposed`; sync promotes it to `Accepted`), `date`
        (YYYY-MM-DD), `change` (this change's name).
      - `supersedes`: optional, the number of an existing ADR in the specs root `adrs/` directory
        that this one replaces (e.g. `0003`).

      If there is genuinely no architecturally significant decision, create a single
      `adrs/none.md` with `status: none` and one sentence explaining why. Sync skips it.
      A Size S change on the full path writes just `adrs/none.md` (an ADR makes the change at least M);
      on the fast path nothing is written.

      ADRs are promoted to the specs root `adrs/` directory when specs are synced:
      `wingman-spec sync <change>` merges the specs and then promotes the ADRs, numbered `NNNN-<slug>.md`.
    requires:
      - specs

  - id: tasks
    generates: tasks.md
    description: Test-first implementation checklist for junior developers
    template: tasks.md
    instruction: |
      Create the task list for the implementation phase. It is executed by junior developers
      or by one FRESH subagent per task that does exactly ONE task and is then checked by a
      script, so every task must be self-contained.

      **IMPORTANT: Follow the template exactly.** The apply phase tracks `- [ ] X.Y` checkbox
      lines only. Detail lines under a task must be indented and must NOT be checkboxes.

      **Size comes from proposal.md.** Do not repeat it here. The `Size:` line of proposal.md caps
      the number of implementation tasks (review tasks not counted): S at most 3, M at most 5,
      L at most 8. `wingman-spec lint` fails a plan over its cap, a Size line in tasks.md that
      disagrees with proposal.md, and a change whose specs need a bigger size (`size`); `next`
      refuses them. Fewer, fuller tasks are cheaper: every task is a fresh subagent that
      re-reads the change.

      For every task, include indented lines:
      - `Spec:` the scenarios it satisfies, as `capability > Requirement name (Scenario name,
        Scenario name)` or `capability > Requirement name (all scenarios)`. Separate several parts
        with `;`. The verifier fails the task when a named scenario has no test tagged
        `[capability/scenario-slug]`. A bare `capability > Requirement name` only warns, because a
        later task may finish it.
      - `Test first:` the failing test to write before any code: the file and what it asserts.
        Tests assert behaviour: return values, rendered DOM, HTTP responses. They never read
        source text: no `?raw` imports, no regex over `.vue`, `.css` or `src/` files. The
        verifier rejects such tests. Layout and look belong in a ```visual scenario. Each test
        title starts with the scenario id in square brackets, for example
        `it('[list-search/zero-matches] shows the empty state')`.
      - `Files:` files likely created or touched. With a `design-map.md`, follow it: the
        components and token files it names; a new component only where the map lists a gap.
      - `Done when:` the observable condition, with the command that must pass in backticks,
        e.g. ``Done when: `npm test -- due` exits 0``. The verifier runs the first backticked
        span; review tasks may state a condition without a command.
      - `Visual:` (UI tasks only) the visual scenario ids this task makes true, comma-separated
        (`<capability>/<scenario-slug>` or the scenario name), or `all`. The verifier checks
        exactly these as the task's own and clips them before and after for the reviewer. Name a
        scenario only from the task that completes it. At least one task names each visual
        scenario in the specs.
        If a control's spoken name says more than its visible text (a menu button with a count,
        "Remove <name>"), the task says how to build it:
        - Put the extra words in visually hidden text inside the control, with an explicit
          leading space. Do not use an `aria-label` that differs from the visible text.
        - A status message is a live region that is always rendered and whose text changes. Do
          not add it with `v-if`. Its `Test first:` asserts that text.

      Rules:
      - One task = one red/green/refactor cycle, small enough to finish in one session.
      - Merge consecutive tasks that change the same source file into one task. Keep them apart
        only when their tests differ in kind, such as a unit test and a DOM or visual check. Lint
        flags the pairs.
      - Order by dependency. The first group should deliver a walking skeleton.
      - Cover every scenario in the specs with at least one task (traceability).
      - Code anchors (`traceability` not `off`): put the marker
        `@spec <capability>/<requirement-slug>` in a comment, in any comment syntax. The slug is
        the requirement name, lower-cased, with dashes. Place it next to the code that implements
        each requirement the task covers, and in a test that proves it. A test may carry the
        `[capability/scenario-slug]` tag instead. `finish` fails a requirement with no code
        anchor or no test anchor. The script reads the markers; you only write the comments.
        Placement rules: see `spec-implementer`.
      - Reviews: a Size M/L change, a Risk kind or a UI change ends with `Request code review of the whole change`. A fast change has no review task.
        A review task may fix what it finds in any file named in a `Files:` line of this change's
        tasks; the visual guard treats those files as its scope. It needs no `Files:` line.
        Add a group review (`N.R Request code review for group N`) only in two places: after
        group 1 (the walking skeleton) of an L change, and after a group whose heading is marked
        `(risky)`: security, money, data migration, concurrency or a public API.
      - No close-out tasks. After the last task, `wingman-spec finish` runs the full test
        suite, typecheck, lint, `wingman-spec validate`, every visual scenario and the trace
        check, without an agent.
      - Before writing tasks, check design.md's Open Questions. Resolve any that would change
        what gets built with the user first.
    requires:
      - specs

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Implementation is test-driven, one fresh subagent per dispatch (the whole change when it is Size S, one task group when M/L). Run it with `/spec-apply <change>`:
    the main agent orchestrates and `wingman-spec` decides whether each task
    is done (`next` hands out a dispatch, `check` verifies it and reverts a bad tick). Read
    proposal.md, specs/, design.md, adrs/ and tasks.md (those that exist).

    Per task, in this order:
    1. Pick the first unchecked `- [ ]` task. Do ONLY that task.
    2. Use the `test-driven-development` skill: write the failing test named in `Test first:`,
       run it and watch it fail for the right reason, write the minimal code to pass, then
       refactor with tests green. Tag each test title with the id of the scenario it proves
       (`[capability/scenario-slug]`) and test behaviour, not source text. Anchor the
       code: write a comment `@spec <capability>/<requirement-slug>` (any comment syntax) next to
       the code that implements each requirement of the task and in its test (the packet lists
       the markers; where a marker goes: see `spec-implementer`); the verifier rejects a marker that does not resolve. Apply the `ponytail` skill (full): implement only what the
       spec requires; skip unrequested options; name skipped extras in your reply.
    3. If anything fails unexpectedly, or a fix attempt fails twice, stop guessing and use the
       `systematic-debugging` skill to find the root cause before changing more code.
    4. For `Request code review` tasks, use the `requesting-code-review` skill with the
       BASE_SHA and HEAD_SHA the prompt gives (never `git rev-parse HEAD~1`) and the `ponytail-review` skill (YAGNI/lean). Treat ponytail-review Must fix as Critical and
       Should fix (including lean/yagni) as Important. Fix Critical/Important findings before
       checking the box. A review task may edit any file named in the change's tasks' `Files:`
       lines (the visual guard allows ARIA changes there), so fix in-change findings now
       instead of deferring them to `/spec-fix`.
    5. Run the `Done when:` command, and use the `verification-before-completion` skill
       before claiming success. For a task with a `Visual:` line (or one that changes UI files),
       run `wingman-spec visual <change>` and fix every defect it lists,
       including failed `expect:` lines (match the mapped token or literal value; never edit the
       expectation), and read its ARIA changes. Accessible names and live regions: see
       `spec-implementer`.
    6. Do not edit tasks.md: `wingman-spec check` ticks the task when it passes.

    Only with `visual.review: subagent` in wingman-spec.yaml (default off): after `check` passes
    the deterministic visual check, an independent `spec-visual-reviewer` subagent judges
    before/after clips of the task's affected areas against the scenarios and the design
    reference; its defects come back like a failing test. Nobody reviews their own screenshots.

    If the task is impossible or the specs are wrong or ambiguous, do NOT improvise. Write the
    problem to BLOCKED.md in the change directory and stop. Never edit specs or ADRs during
    apply; tell the user to run `/spec-fix`.

    When no unchecked tasks remain, the orchestrator runs `wingman-spec finish <change>`: full
    tests, typecheck, lint, validate, every visual scenario, trace tags, no source-text tests.
    A failure goes to one implementer with the fix prompt that finish writes; then finish runs
    again. Then tell the user to run `/spec-archive <change>`. It runs `/spec-sync <change>` (specs, ADRs, anchors and drift check) first and stops on a sync problem;
    `wingman-spec archive` refuses a change that is not synced. If the finish result lists
    `why_owner_approval`, the change rewrites a Why or removes a requirement: show it to the owner.
