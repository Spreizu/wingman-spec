version: "2"
run:
  go: "1.27"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
  exclusions:
    paths:
      - tests
      - go-skills
      - vscode-extension
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Spreizu/wingman-spec
